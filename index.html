const KEY='healthy_relationships_learning_v1';
function initial(){return {done:{},attempts:{},quiz:{},checked:{},started:Date.now()}}
let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=initial()}
let page='home',stageIndex=0,activityIndex=0,activeFeedback=null,draft={},openResponses={};
const el=document.getElementById('app');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const allItems=DATA.stages.flatMap((s,si)=>s.items.map((item,ii)=>({...item,key:si+'-'+ii})));
function counts(){return allItems.filter(i=>state.done[i.key]==='correct').length}
function percent(){return Math.round(counts()/15*100)}
function markNav(){for(let k of ['home','quiz','review','print']){let b=document.getElementById(k+'Nav');b.classList.toggle('active',page===k)}}
function go(p,si=0,ai=0){page=p;stageIndex=si;activityIndex=ai;activeFeedback=null;draft={};markNav();render();window.scrollTo(0,0)}
function render(){if(page==='home')home();else if(page==='stage')stage();else if(page==='activity')activity();else if(page==='quiz')quiz();else if(page==='review')review();else if(page==='print')printing()}
function home(){el.innerHTML=`<div class="hero"><div class="eyebrow">تجربة تعلم واحدة • ٥ لقاءات</div><h2>من الفهم إلى التطبيق</h2><p>اختاري مرحلة، ثم أجيبي قبل كشف التفسير. يمكنك العودة ومراجعة إجاباتك في أي وقت.</p><div class="bar"><span style="width:${percent()}%"></span></div><div class="muted">أنجزتِ ${counts()} من 15 تدريبًا (${percent()}%)</div></div><div class="grid">${DATA.stages.map((s,i)=>`<button class="tile" onclick="go('stage',${i})"><div class="symbol">${s.icon}</div><strong>${i+1}. ${s.name}</strong><small>${s.sub}</small><br><span class="pill">${s.items.filter((_,j)=>state.done[i+'-'+j]==='correct').length} / 3 أنشطة</span></button>`).join('')}</div><h3 class="sectiontitle">بعد المحطات الخمس</h3><div class="panel"><h3>اختبار تكاملي • 20 مهمة</h3><p class="muted">15 سؤالًا موضوعيًا بتصحيح فوري، و5 مهام كتابة مع معايير مراجعة ذاتية. لا يُعد الاختبار تشخيصًا.</p><button class="btn" onclick="go('quiz')">فتح الاختبار</button></div><div class="notice">مهم: التعلم هنا لا يقتضي استرجاع تجربة شخصية مؤلمة أو مشاركتها. عند وجود تهديد أو عنف، قدّمي سلامتك واطلبي دعمًا مناسبًا.</div>`}
function stage(){let s=DATA.stages[stageIndex];el.innerHTML=`<div class="hero"><span class="eyebrow">اللقاء ${stageIndex+1} من 5</span><h2>${s.name}: ${s.sub}</h2><p>${s.concept}</p></div><h3>التدريبات المتدرجة</h3><div class="itemlist">${s.items.map((i,j)=>`<button class="itembutton" onclick="go('activity',${stageIndex},${j})"><div><strong>${j+1}. ${i.title}</strong><div class="muted">${['تمييز واسترجاع','تحليل وفهم','تطبيق ونقل'][j]}</div></div><span>${state.done[stageIndex+'-'+j]==='correct'?'✓ أُنجز':state.done[stageIndex+'-'+j]==='review'?'↻ يحتاج مراجعة':'ابدئي ←'}</span></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="go('home')">كل اللقاءات</button>${stageIndex<4?`<button class="btn secondary" onclick="go('stage',${stageIndex+1})">اللقاء التالي</button>`:`<button class="btn secondary" onclick="go('quiz')">الاختبار النهائي</button>`}</div>`}
function activity(){let a=DATA.stages[stageIndex].items[activityIndex],key=stageIndex+'-'+activityIndex;let body='';if(a.type==='single'||a.type==='multi'){body=a.options.map((x,i)=>`<label class="option"><input ${a.type==='single'?'type="radio"':'type="checkbox"'} name="act" value="${i}" ${a.type==='single'?'onclick="activeFeedback=null"':''}> <span>${escapeHTML(x)}</span></label>`).join('')}else{body=a.pairs.map((x,i)=>`<div class="pair"><strong>${escapeHTML(x.text)}</strong><select data-pair="${i}" aria-label="اختاري المفهوم لعبارة ${i+1}"><option value="">اختاري المفهوم…</option>${a.choices.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}</select></div>`).join('')}
el.innerHTML=`<div class="hero"><div class="eyebrow">${DATA.stages[stageIndex].name} • التدريب ${activityIndex+1} من 3</div><h2>${escapeHTML(a.title)}</h2><p>${['تذكري المفهوم','حللي الأدلة','طبّقي في موقف'][activityIndex]}</p></div><section class="panel"><div class="question">${escapeHTML(a.question)}</div>${body}<div class="actions"><button class="btn" onclick="checkActivity()">تحقق من إجابتي</button><button class="btn secondary" onclick="go('stage',${stageIndex})">العودة إلى اللقاء</button></div><div id="result" aria-live="polite"></div></section>`}
function checkActivity(){let a=DATA.stages[stageIndex].items[activityIndex],key=stageIndex+'-'+activityIndex;let correct=false, answered=false;if(a.type==='single'){let x=document.querySelector('input[name="act"]:checked');if(x){answered=true;correct=Number(x.value)===a.answer}}else if(a.type==='multi'){let xs=[...document.querySelectorAll('input[name="act"]:checked')].map(e=>Number(e.value)).sort();answered=xs.length>0;correct=JSON.stringify(xs)===JSON.stringify([...a.answer].sort())}else{let xs=[...document.querySelectorAll('select[data-pair]')].map(e=>e.value);answered=xs.every(Boolean);correct=xs.every((v,i)=>v===a.pairs[i].answer)}let result=document.getElementById('result');if(!answered){result.innerHTML='<div class="feedback warn">اختاري الإجابة أولًا لتلقي تفسير مفيد.</div>';return}state.attempts[key]=(state.attempts[key]||0)+1;state.done[key]=correct?'correct':'review';save();let next=activityIndex<2?`<button class="btn" onclick="go('activity',${stageIndex},${activityIndex+1})">التدريب التالي</button>`:stageIndex<4?`<button class="btn" onclick="go('stage',${stageIndex+1})">اللقاء التالي</button>`:`<button class="btn" onclick="go('quiz')">الاختبار النهائي</button>`;result.innerHTML=`<div class="feedback ${correct?'':'warn'}"><strong>${correct?'✓ إجابة مناسبة':'راجعي الفكرة ثم أعيدي المحاولة'}</strong><p>${escapeHTML(a.feedback)}</p>${!correct?'<p class="muted">يمكنك تعديل اختيارك والمحاولة من جديد.</p>':''}</div><div class="actions">${next}</div>`}
function quiz(){let qs=DATA.quiz;let checked=Object.keys(state.checked).length;let correct=qs.filter((q,i)=>state.checked[i]&&state.quiz[i]===q.answer).length;el.innerHTML=`<div class="hero"><span class="eyebrow">بعد إنهاء المحطات</span><h2>الاختبار التكاملي</h2><p>15 سؤالًا موضوعيًا و5 مهام تطبيقية. أجيبي ثم تحققي من تفسير كل سؤال.</p><div class="muted">إجابات تم التحقق منها: ${checked}/15 • صحيحة: ${correct}</div></div>${qs.map((q,i)=>`<section class="panel"><span class="pill">سؤال ${i+1} / 15</span><div class="question">${escapeHTML(q.question)}</div>${q.options.map((v,j)=>`<label class="option"><input type="radio" name="quiz${i}" value="${j}" ${state.quiz[i]===j?'checked':''} onchange="pickQuiz(${i},${j})"><span>${escapeHTML(v)}</span></label>`).join('')}<div class="actions"><button class="btn secondary" onclick="verifyQuiz(${i})">تحقق من السؤال</button></div><div id="qresult${i}" aria-live="polite">${state.checked[i]?quizFeedback(i):''}</div></section>`).join('')}<h3 class="sectiontitle">مهام تطبيق كتابية — مراجعة ذاتية</h3><p class="muted">لخصوصيتك لا تُحفظ النصوص المكتوبة هنا عند إغلاق الصفحة. لا يوجد تصحيح آلي يقرر جودة علاقتك أو مشاعرك.</p>${DATA.open.map((q,i)=>`<section class="panel"><span class="pill">مهمة ${i+16}</span><div class="question">${escapeHTML(q.question)}</div><textarea id="open${i}" placeholder="اكتبي إجابتك عن موقف افتراضي، دون تفاصيل شخصية حساسة"></textarea><div class="actions"><button class="btn secondary" onclick="showRubric(${i})">عرض معايير التقييم</button></div><div id="rubric${i}"></div></section>`).join('')}<section class="panel"><h3>ملخص التقييم الموضوعي</h3><div class="result">${correct} / 15</div><p class="muted">هذه نتيجة للأسئلة الموضوعية المتحقق منها فقط؛ المهام المفتوحة لا تدخل في الدرجة.</p><button class="btn secondary" onclick="go('review')">مراجعة الأخطاء</button></section>`}
function quizFeedback(i){let q=DATA.quiz[i],ok=state.quiz[i]===q.answer;return `<div class="feedback ${ok?'':'warn'}"><strong>${ok?'✓ إجابة مناسبة':'الإجابة الأنسب: '+escapeHTML(q.options[q.answer])}</strong><div>${escapeHTML(q.feedback)}</div></div>`}
function pickQuiz(i,j){state.quiz[i]=j;delete state.checked[i];save();document.getElementById('qresult'+i).innerHTML=''}
function verifyQuiz(i){if(state.quiz[i]===undefined){document.getElementById('qresult'+i).innerHTML='<div class="feedback warn">اختاري إجابة أولًا.</div>';return}state.checked[i]=true;save();document.getElementById('qresult'+i).innerHTML=quizFeedback(i)}
function showRubric(i){document.getElementById('rubric'+i).innerHTML=`<div class="feedback"><strong>معيار مراجعة الإجابة:</strong><p>${escapeHTML(DATA.open[i].rubric)}</p></div>`}
function review(){let wrong=allItems.filter(a=>state.done[a.key]==='review');let qwrong=DATA.quiz.map((q,i)=>({...q,i})).filter(q=>state.checked[q.i]&&state.quiz[q.i]!==q.answer);el.innerHTML=`<div class="hero"><h2>مراجعة نقاط الالتباس</h2><p>راجعي سبب الخطأ، ثم أعيدي التدريب في موقفه الأصلي. لا يوجد عقاب أو ترتيب تنافسي.</p></div><h3>تدريبات تحتاج مراجعة (${wrong.length})</h3>${wrong.length?`<div class="itemlist">${wrong.map(x=>`<button class="itembutton" onclick="go('activity',${x.key.split('-')[0]},${x.key.split('-')[1]})"><strong>${escapeHTML(x.title)}</strong><span>إعادة المحاولة</span></button>`).join('')}</div>`:'<p class="muted">لا توجد تدريبات مسجلة للمراجعة. ابدئي باللقاءات أولًا.</p>'}<h3 class="sectiontitle">أسئلة ختامية تحتاج مراجعة (${qwrong.length})</h3>${qwrong.map(q=>`<div class="panel"><strong>${escapeHTML(q.question)}</strong><p class="muted">${escapeHTML(q.feedback)}</p></div>`).join('')||'<p class="muted">لا توجد أسئلة ختامية خاطئة محفوظة.</p>'}<div class="panel"><h3>استرجاع متباعد</h3><p>راجعي المفاهيم دون عرض الإجابات أولًا بعد يوم، ثم 3 أيام، ثم أسبوع. هذا جدول مقترح ويمكن تعديله بحسب أدائك.</p><button class="btn" onclick="go('quiz')">العودة للاختبار</button></div>`}
function printing(){el.innerHTML=`<div class="hero"><h2>أوراق التعلم والطباعة</h2><p>تضم هذه الصفحة التدريبات والمهام وأسئلة الاختبار دون إظهار الحلول في النسخة المطبوعة.</p></div><div class="actions no-print"><button class="btn" onclick="window.print()">طباعة / حفظ كـ PDF</button><button class="btn secondary" onclick="go('home')">الرئيسية</button></div>${DATA.stages.map((s,i)=>`<section class="panel"><h3>اللقاء ${i+1} — ${s.name}</h3><p>${escapeHTML(s.concept)}</p>${s.items.map((a,j)=>`<div class="pair"><strong>${j+1}. ${escapeHTML(a.title)}</strong><div>${escapeHTML(a.question)}</div>${a.options?`<ol>${a.options.map(o=>`<li>${escapeHTML(o)}</li>`).join('')}</ol>`:a.pairs.map(p=>`<div>— ${escapeHTML(p.text)}</div>`).join('')}<p>الإجابة / التفسير: ....................................................</p></div>`).join('')}</section>`).join('')}<h2>اختبار تكاملي</h2>${DATA.quiz.map((q,i)=>`<section class="panel"><strong>${i+1}. ${escapeHTML(q.question)}</strong><ol>${q.options.map(o=>`<li>${escapeHTML(o)}</li>`).join('')}</ol></section>`).join('')}<h2>مهام تطبيقية</h2>${DATA.open.map((q,i)=>`<section class="panel"><strong>${i+16}. ${escapeHTML(q.question)}</strong><p>الإجابة: .................................................................................</p><p>........................................................................................</p></section>`).join('')}<div class="printonly">جميع أسئلة هذا الملحق للتعلم والمراجعة وليست لتشخيص الأشخاص أو العلاقات.</div>`}
render();
</script></body></html>
